name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22'
          - '24'
          - '26'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run project checks
        run: npm run check

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit known vulnerabilities
        run: npm run audit:security

      - name: Verify registry signatures and provenance
        run: npm run audit:signatures

      - name: Inspect package contents
        run: npm pack --dry-run

  required:
    name: CI / Required
    if: always()
    needs:
      - test
      - supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: Confirm required jobs passed
        run: |
          if [[ "$TEST_RESULT" != "success" || "$SUPPLY_CHAIN_RESULT" != "success" ]]; then
            exit 1
          fi
